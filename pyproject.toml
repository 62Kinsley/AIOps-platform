[project]
name = "aiops-platform"
version = "0.1.0"
description = "AIOps platform: root cause analysis on the RCAEval microservice benchmark"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "pyarrow>=14",
    "huggingface_hub>=0.23",
]

[project.scripts]
aiops-data = "aiops.data.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
